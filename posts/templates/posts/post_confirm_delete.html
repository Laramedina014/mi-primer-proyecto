{% extends "posts/base.html" %}

{% block title %}Eliminar posts | Mi Blog{% endblock %}

{% block content %}
    
    <h1>Eliminar post</h1>

    <p>¿Estás seguro de que quieres eliminar el siguiente post?</p>

    <h2>{{ post.titulo }}</h2>

    <p>{{ post.contenido|truncatewords:30 }}</p>

    <form method="post">
        {% csrf_token %}

        <button type="submit">Sí, eliminar</button>
    </form>

    <a href="{% url 'detalle_post' post.slug %}">Cancelar</a>
{% endblock %}
